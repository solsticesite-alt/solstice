<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Maison Solstice — Back-office</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{
    --paper:#FBF8F2;--paper-2:#F5EEE1;--sand:#EEE4D3;--ink:#221C15;--ink-soft:#5B5142;--stone:#6F6455;
    --line:#E6DCCB;--gold:#B08A54;--gold-deep:#8C6C3D;--gold-soft:#CBAA76;--ok:#3f7a4f;--warn:#a9762f;--bad:#b0472f;
    --serif:'Didot','Bodoni MT','Playfair Display',Georgia,serif;--sans:'Helvetica Neue',Helvetica,Arial,system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.1;}
  button{font-family:inherit;cursor:pointer;}
  a{color:var(--gold-deep);}
  .hidden{display:none!important;}
  .wrap{max-width:1200px;margin:0 auto;padding:0 clamp(16px,3vw,32px);}

  .topbar{position:sticky;top:0;z-index:20;background:rgba(251,248,242,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .topbar-in{display:flex;align-items:center;justify-content:space-between;height:60px;gap:1rem;}
  .brand{font-family:var(--serif);letter-spacing:.34em;text-transform:uppercase;font-size:1.05rem;}
  .brand small{font-family:var(--sans);letter-spacing:.14em;font-size:.6rem;color:var(--stone);display:block;margin-top:2px;}
  .topbar-tools{display:flex;gap:.5rem;align-items:center;}
  .btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:.55em 1em;font-size:.82rem;transition:.2s;}
  .btn:hover{border-color:var(--gold);}
  .btn-gold{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .btn-gold:hover{background:#000;}
  .btn-sm{padding:.35em .7em;font-size:.76rem;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  /* ----- Bannière config ----- */
  .banner{background:#FBE7C8;border:1px solid #E7C98A;color:#6b4a1c;border-radius:12px;padding:14px 18px;margin:18px 0;font-size:.86rem;}
  .banner b{color:#5a3d12;}
  .banner ul{margin:.4rem 0 0;padding-left:1.1rem;}

  /* ----- Login ----- */
  .login-screen{min-height:70vh;display:grid;place-items:center;padding:24px;}
  .login-card{width:100%;max-width:360px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:34px 30px;box-shadow:0 30px 60px -44px rgba(34,28,21,.5);}
  .login-card h1{font-size:1.6rem;margin-bottom:.2rem;}
  .login-card p{color:var(--stone);font-size:.85rem;margin:.2rem 0 1.4rem;}
  label{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:.35rem;}
  input,select,textarea{width:100%;font-family:inherit;font-size:.95rem;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:.7em .85em;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,138,84,.14);}
  textarea{resize:vertical;min-height:80px;}
  .err{color:var(--bad);font-size:.82rem;margin-top:.5rem;min-height:1em;}

  /* ----- Dashboard ----- */
  .dash{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:22px;padding:22px 0 60px;align-items:start;}
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 22px 44px -40px rgba(34,28,21,.4);}
  .list-head{display:flex;gap:.5rem;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .list-head input{flex:1;min-width:120px;}
  .filters{display:flex;gap:.3rem;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  /* Barre de tri : discrète, mais toujours visible. Le tri par date
     d'événement est ce qui remonte l'urgent, que la date de demande enterrait. */
  .listbar{display:flex;align-items:center;gap:.5rem;padding:8px 16px;border-bottom:1px solid var(--line);
    font-size:.76rem;color:var(--stone);}
  .listbar select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);
    border-radius:8px;padding:.25rem .45rem;cursor:pointer;}
  /* Le délai avant l'événement. C'est l'information qui manquait le plus :
     six demandes sur neuf portaient sur une date déjà passée, sans que rien
     ne les distingue de celles encore à préparer. */
  .req-when{font-size:.72rem;font-weight:600;letter-spacing:.02em;}
  /* Le montant, aligne a droite : la colonne se lit verticalement, on compare
     les demandes sans avoir a les ouvrir. */
  /* Reference et montant sur la MEME ligne : la colonne des montants se lit
     alors verticalement, et la fiche ne gagne pas une ligne pour si peu. */
  .req-bas{display:flex;align-items:baseline;justify-content:space-between;gap:.7rem;}
  .req-montant{font-size:.8rem;white-space:nowrap;}
  /* ---- Panneau d'accueil ---- */
  .accueil{padding:clamp(18px,3vw,34px);}
  .accueil h2{font-family:var(--serif);font-size:1.5rem;margin:0 0 1.2rem;font-weight:400;}
  .acc-cartes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;}
  .acc-carte{display:flex;flex-direction:column;gap:.15rem;text-align:left;padding:14px 16px;
    background:var(--paper);border:1px solid var(--line);border-radius:14px;cursor:pointer;
    transition:border-color .2s,transform .2s;}
  .acc-carte:hover{border-color:var(--gold-soft);transform:translateY(-1px);}
  .acc-carte.vide{opacity:.6;cursor:default;}
  .acc-carte.vide:hover{border-color:var(--line);transform:none;}
  .acc-n{font-family:var(--serif);font-size:1.9rem;line-height:1;color:var(--ink);}
  .acc-l{font-size:.82rem;color:var(--ink-soft);}
  .acc-d{font-size:.72rem;color:var(--stone);}
  .acc-titre{font-family:var(--serif);font-size:1rem;font-weight:400;margin:1.6rem 0 .5rem;color:var(--ink-soft);}
  .acc-liste{list-style:none;margin:0;padding:0;}
  .acc-liste button{display:grid;grid-template-columns:7.5rem 1fr auto auto;gap:.8rem;align-items:baseline;
    width:100%;text-align:left;padding:.6rem .2rem;border:none;background:none;cursor:pointer;
    border-bottom:1px solid var(--line);}
  .acc-liste button:hover{background:var(--paper-2);}
  .acc-quand{font-size:.72rem;font-weight:600;}
  .acc-quand.proche{color:#A2543C;} .acc-quand.venir{color:#5C7A5A;}
  .acc-qui{font-size:.9rem;color:var(--ink);}
  .acc-quoi{font-size:.76rem;color:var(--stone);}
  .acc-eur{font-family:var(--serif);font-size:.95rem;color:var(--ink);}
  .acc-alerte{margin:1.4rem 0 0;font-size:.82rem;color:#A2543C;}
  @media (max-width:700px){ .acc-liste button{grid-template-columns:1fr auto;} .acc-quoi{display:none;} }
  .req-montant .m-val{font-family:var(--serif);font-size:1rem;color:var(--ink);}
  .req-montant .m-note{font-size:.68rem;color:var(--stone);}
  .req-montant .m-vide{font-size:.72rem;color:var(--stone);font-style:italic;}
  .req-when.proche{color:#A2543C;}
  .req-when.venir{color:#5C7A5A;}
  .req-when.passe{color:var(--stone);font-weight:400;}
  .req.est-passe .req-name{color:var(--stone);}
  .req.est-passe{opacity:.72;}
  .chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:.3em .8em;font-size:.74rem;color:var(--ink-soft);}
  .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .reqs{list-style:none;margin:0;padding:6px;max-height:72vh;overflow:auto;}
  .req{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:11px;padding:12px 12px;margin:2px 0;transition:.15s;}
  .req:hover{background:var(--paper-2);}
  .req.sel{background:var(--paper-2);border-color:var(--gold-soft);}
  .req-top{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline;}
  .req-name{font-weight:600;font-size:.95rem;}
  .req-sub{color:var(--stone);font-size:.78rem;margin-top:2px;}
  .req-ref{color:var(--gold-deep);font-size:.7rem;letter-spacing:.06em;}
  .badge{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:.25em .6em;border-radius:99px;white-space:nowrap;}
  .b-new{background:#e9f0e9;color:var(--ok);}
  .b-read{background:var(--sand);color:var(--ink-soft);}
  .b-replied{background:#efe3c8;color:var(--gold-deep);}
  .b-bounce{background:#f6e3df;color:var(--bad);}
  .alert-note{background:#f6e3df;border:1px solid #e2b8ad;color:var(--bad);border-radius:10px;padding:11px 14px;font-size:.85rem;margin-bottom:12px;display:flex;gap:.7rem;align-items:flex-start;flex-wrap:wrap;}
  .alert-note b{color:#8a3320;}
  .empty{padding:40px 20px;text-align:center;color:var(--stone);font-size:.9rem;}

  /* ----- Détail ----- */
  .detail{padding:22px 24px;}
  .detail .muted{color:var(--stone);}
  .d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;}
  .d-head h2{font-size:1.5rem;}
  .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 20px;background:var(--paper-2);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
  .info-grid .k{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);}
  .info-grid .v{font-weight:600;font-size:.92rem;word-break:break-word;}
  .info-grid .v a{word-break:break-all;}
  .blockquote{background:var(--paper-2);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:10px 14px;margin:0 0 16px;font-size:.92rem;white-space:pre-wrap;}
  .section-title{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);font-weight:700;margin:18px 0 10px;}

  /* ----- Composeur de facture ----- */
  .devis{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:6px;}
  .lines{width:100%;border-collapse:collapse;}
  .lines th{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);text-align:left;padding:0 6px 6px;font-weight:600;}
  .lines td{padding:3px 6px;vertical-align:middle;}
  .lines input{padding:.5em .6em;}
  .lines .num{text-align:right;}
  .lines input.num{text-align:right;}
  .cell-label input{width:100%;}
  .cell-qty{width:74px;} .cell-unit{width:104px;} .cell-tot{width:96px;text-align:right;font-weight:600;white-space:nowrap;} .cell-x{width:30px;}
  .lx{border:none;background:transparent;color:var(--stone);font-size:1.1rem;line-height:1;padding:2px 6px;border-radius:6px;}
  .lx:hover{color:var(--bad);background:#f6e3df;}
  .tots{display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin-top:12px;font-size:.92rem;}
  .tots .big{font-size:1.15rem;font-weight:700;font-family:var(--serif);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  .field{margin-top:12px;}
  .devis-actions{display:flex;gap:.6rem;align-items:center;margin-top:16px;flex-wrap:wrap;}
  .sent-note{background:#efe3c8;color:var(--gold-deep);border-radius:10px;padding:10px 14px;font-size:.85rem;margin-bottom:12px;}

  /* ----- Modal ----- */
  /* Effacement d'une demande : discret au repos, franc une fois engagé. */
  .rgpd-zone{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-top:26px;padding-top:16px;border-top:1px solid var(--line);}
  .rgpd-zone .muted{color:var(--stone);font-size:.78rem;flex:1 1 260px;}
  .btn.danger{border-color:#C7A6A0;color:#8E4B3C;background:#FDF6F4;}
  .btn.danger:hover{border-color:#8E4B3C;background:#8E4B3C;color:#fff;}
  .modal .avert{background:#FDF6F4;border:1px solid #E7CFC9;border-radius:10px;padding:12px 14px;margin:.6rem 0 1rem;font-size:.86rem;line-height:1.55;color:#7A4436;}
  .modal .avert b{color:#5E3227;}
  .modal-bg{position:fixed;inset:0;background:rgba(34,28,21,.5);z-index:50;display:grid;place-items:center;padding:20px;}
  .modal{background:var(--paper);border-radius:18px;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:26px 28px;}
  .modal h2{font-size:1.4rem;margin-bottom:.3rem;}
  .modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal .field{margin-top:12px;}

  /* ----- Toast ----- */
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:10px;font-size:.88rem;opacity:0;transition:.3s;z-index:80;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.bad{background:var(--bad);}

  /* ----- Onglets ----- */
  .tabs{display:flex;gap:.2rem;}
  .tab{position:relative;border:1px solid transparent;background:transparent;border-radius:99px;padding:.42em 1em;font-size:.84rem;color:var(--ink-soft);transition:.15s;}
  .tab:hover{background:var(--paper-2);}
  .tab.on{background:var(--ink);color:var(--paper);}
  .tab .pill{display:inline-block;min-width:18px;padding:0 5px;margin-left:.45em;border-radius:99px;background:var(--gold);color:#fff;font-size:.66rem;line-height:18px;text-align:center;font-weight:700;vertical-align:1px;}
  .tab.on .pill{background:var(--gold-soft);color:var(--ink);}

  /* ----- Messagerie ----- */
  .mail{display:grid;grid-template-columns:minmax(320px,400px) 1fr;gap:22px;padding:22px 0 60px;align-items:start;}
  /* Sans cela, un élément de grille se dimensionne sur son contenu minimal :
     une longue ligne de conversation élargirait toute la page. */
  .mail > .panel{min-width:0;}
  .mlist{list-style:none;margin:0;padding:6px;max-height:72vh;overflow:auto;}
  .mrow{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:11px;padding:10px 12px;margin:2px 0;transition:.12s;}
  .mrow:hover{background:var(--paper-2);}
  .mrow.sel{background:var(--paper-2);border-color:var(--gold-soft);}
  .m-top{display:flex;justify-content:space-between;gap:.6rem;align-items:baseline;}
  .m-from{font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mrow.unseen .m-from,.mrow.unseen .m-subj{font-weight:700;}
  .m-date{font-size:.72rem;color:var(--stone);white-space:nowrap;flex:none;}
  .m-subj{font-size:.86rem;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .m-prev{font-size:.78rem;color:var(--stone);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .m-marks{display:inline-flex;gap:.3rem;align-items:center;margin-right:.35em;}
  .m-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);display:inline-block;}
  .m-clip,.m-star{font-size:.78rem;line-height:1;color:var(--stone);}
  .m-star.on{color:var(--gold);}
  .more-row{padding:10px;text-align:center;}

  .mdetail{padding:20px 22px;}
  .mh-top{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;flex-wrap:wrap;}
  .mh-subject{font-family:var(--serif);font-size:1.35rem;line-height:1.2;}
  .mh-meta{color:var(--stone);font-size:.82rem;margin-top:.3rem;word-break:break-word;}
  .mh-actions{display:flex;gap:.4rem;flex-wrap:wrap;}
  .linkreq{display:inline-flex;align-items:center;gap:.5em;background:#efe3c8;color:var(--gold-deep);border:1px solid var(--gold-soft);border-radius:10px;padding:8px 12px;font-size:.82rem;margin:12px 0 0;}
  .mbody{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;margin-top:14px;}
  .mbody iframe{width:100%;border:0;display:block;min-height:180px;background:#fff;}
  .imgbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;background:#FBE7C8;border-bottom:1px solid #E7C98A;color:#6b4a1c;padding:8px 12px;font-size:.8rem;}
  .atts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:12px;}
  .att{display:inline-flex;align-items:center;gap:.5em;border:1px solid var(--line);border-radius:10px;padding:.5em .8em;font-size:.8rem;color:var(--ink);background:var(--paper);text-decoration:none;}
  .att:hover{border-color:var(--gold);}
  .att .sz{color:var(--stone);font-size:.74rem;}

  /* ----- Fil de discussion ----- */
  .thread{margin-top:20px;border-top:1px solid var(--line);padding-top:16px;}
  .thread-h{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);font-weight:700;margin-bottom:10px;}
  .tmsg{border:1px solid var(--line);border-radius:11px;margin-bottom:8px;overflow:hidden;background:var(--paper);}
  .tmsg.out{background:var(--paper-2);border-color:var(--sand);}
  .tmsg.cur{border-color:var(--gold-soft);}
  .tmsg-head{display:flex;align-items:baseline;gap:.6rem;width:100%;min-width:0;text-align:left;background:transparent;border:0;padding:10px 13px;}
  .tmsg-head:hover{background:rgba(176,138,84,.06);}
  .tmsg-who{font-weight:600;font-size:.88rem;white-space:nowrap;}
  .tmsg-prev{color:var(--stone);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
  .tmsg-date{color:var(--stone);font-size:.74rem;white-space:nowrap;flex:none;}
  .tmsg-body{border-top:1px solid var(--line);}
  .tmsg-body iframe{width:100%;border:0;display:block;min-height:120px;background:#fff;}
  .tmsg .tag{font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--gold-deep);background:#efe3c8;border-radius:99px;padding:.15em .5em;flex:none;}

  .compose{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px;}
  .compose .to{display:grid;grid-template-columns:auto 1fr;gap:.6rem;align-items:center;margin-bottom:10px;}
  .compose .to label{margin:0;white-space:nowrap;}
  .compose textarea{min-height:150px;background:var(--paper);}
  .compose-actions{display:flex;gap:.6rem;align-items:center;margin-top:12px;flex-wrap:wrap;}
  .compose-actions label.btn{font-size:.82rem;letter-spacing:0;text-transform:none;color:var(--ink);}
  .c-files{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem;}
  .c-file{display:inline-flex;align-items:center;gap:.5em;border:1px solid var(--line);border-radius:9px;padding:.35em .6em;font-size:.78rem;background:var(--paper);}
  .c-file button{border:0;background:transparent;color:var(--stone);font-size:1rem;line-height:1;padding:0 .1em;}
  .c-file button:hover{color:var(--bad);}
  .c-file .sz{color:var(--stone);font-size:.72rem;}

  .hidden-desk{display:none;}
  .skel{background:linear-gradient(90deg,var(--paper-2) 25%,#efe6d6 37%,var(--paper-2) 63%);background-size:400% 100%;animation:shine 1.3s ease-in-out infinite;border-radius:6px;}
  @keyframes shine{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
  .skel-row{padding:12px;} .skel-row div{height:10px;margin:5px 0;}

  @media(max-width:820px){
    .dash{grid-template-columns:1fr;} .modal .grid2{grid-template-columns:1fr;} .row2{grid-template-columns:1fr;}
    .mail{grid-template-columns:1fr;}
    /* L'aperçu passe à la ligne : sur un écran étroit, le nom et l'heure
       tiennent d'abord, le reste suit. */
    .tmsg-head{flex-wrap:wrap;}
    .tmsg-prev{flex:1 1 100%;order:3;}
    .tmsg-date{margin-left:auto;}
    .mail.reading .panel-list{display:none;}
    .mail:not(.reading) > .panel:last-child{display:none;}
    .mlist{max-height:none;}
    .hidden-desk{display:inline-block;}
    .topbar-in{flex-wrap:wrap;height:auto;padding:10px 0;}
    .tabs{order:3;width:100%;}
  }
</style>
</head>
<body>

<div class="topbar hidden" id="topbar">
  <div class="wrap topbar-in">
    <div class="brand">Maison Solstice <small>Back-office · commandes &amp; factures</small></div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button class="tab on" data-tab="orders">Commandes</button>
      <button class="tab" data-tab="mail">Messages<span class="pill hidden" id="unread-pill">0</span></button>
    </nav>
    <div class="topbar-tools">
      <button class="btn btn-sm" id="btn-settings">Réglages</button>
      <button class="btn btn-sm" id="btn-securite">Sécurité<span class="pill hidden" id="pastille-2fa">!</span></button>
      <button class="btn btn-sm" id="btn-logout">Déconnexion</button>
    </div>
  </div>
</div>

<div class="wrap" id="app">
  <div class="empty" id="boot">Chargement…</div>

  <!-- Login -->
  <div class="login-screen hidden" id="login">
    <form class="login-card" id="login-form">
      <h1>Back-office</h1>
      <p>Espace réservé. Entrez le mot de passe administrateur.</p>
      <div id="etape-mdp">
        <label for="pw">Mot de passe</label>
        <input type="password" id="pw" autocomplete="current-password">
      </div>
      <div id="etape-code" class="hidden">
        <label for="code2fa">Code de votre application</label>
        <input type="text" id="code2fa" inputmode="numeric" autocomplete="one-time-code"
               maxlength="7" placeholder="123456" style="letter-spacing:.3em;text-align:center;font-size:1.2rem;">
        <p style="margin:.6rem 0 0;"><button type="button" id="lien-secours"
           style="background:none;border:none;padding:0;color:var(--gold-deep);font-size:.8rem;text-decoration:underline;cursor:pointer;">Je n'ai pas mon téléphone</button></p>
      </div>
      <div id="etape-secours" class="hidden">
        <label for="codesecours">Code de secours</label>
        <input type="text" id="codesecours" autocomplete="off" maxlength="12" placeholder="ABCDE-FGHIJ"
               style="letter-spacing:.14em;text-align:center;">
      </div>
      <div class="err" id="login-err"></div>
      <button class="btn btn-gold" style="width:100%;margin-top:14px;" type="submit" id="login-submit">Entrer</button>
    </form>
  </div>

  <!-- Dashboard -->
  <div class="hidden" id="dash">
    <div id="banner-slot"></div>
    <div class="dash">
      <div class="panel">
        <div class="list-head">
          <input type="search" id="search" placeholder="Rechercher (nom, lieu, réf.)…">
        </div>
        <div class="filters" id="filters">
          <button class="chip on" data-f="all">Toutes</button>
          <button class="chip" data-f="new">Nouvelles</button>
          <button class="chip" data-f="read">Lues</button>
          <button class="chip" data-f="replied">Facturées</button>
          <button class="chip" data-f="avenir" title="Événements pas encore passés">À venir</button>
        </div>
        <div class="listbar">
          <label for="tri">Trier par</label>
          <select id="tri">
            <option value="recu">demande la plus récente</option>
            <option value="event">événement le plus proche</option>
          </select>
        </div>
        <ul class="reqs" id="reqs"><li class="empty">Chargement…</li></ul>
      </div>
      <div class="panel">
        <div class="detail" id="detail"><div class="empty">Sélectionnez une demande à gauche.</div></div>
      </div>
    </div>
  </div>

  <!-- Messagerie -->
  <div class="hidden" id="mailview">
    <div id="mail-banner"></div>
    <div class="mail" id="mail-grid">
      <div class="panel panel-list">
        <div class="list-head">
          <input type="search" id="msearch" placeholder="Rechercher (expéditeur, objet)…">
          <button class="btn btn-sm" id="mrefresh" title="Actualiser">↻</button>
          <button class="btn btn-sm btn-gold" id="mnew" title="Écrire un message">✎ Nouveau</button>
        </div>
        <div class="filters" id="mboxes">
          <button class="chip on" data-box="inbox">Réception</button>
          <button class="chip" data-box="sent">Envoyés</button>
          <button class="chip" data-box="trash">Corbeille</button>
          <button class="chip" data-box="junk">Indésirables</button>
        </div>
        <ul class="mlist" id="mlist"></ul>
      </div>
      <div class="panel">
        <div class="mdetail" id="mdetail"><div class="empty">Sélectionnez un message.</div></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/admin.js"></script>
</body>
</html>
