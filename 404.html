<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable — Solstice</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{--paper:#FBF8F2;--sand:#EEE4D3;--ink:#221C15;--ink-soft:#5B5142;--gold:#B08A54;--gold-deep:#8C6C3D;--serif:'Didot','Bodoni MT','Playfair Display',Georgia,serif;--sans:'Helvetica Neue',Helvetica,Arial,system-ui,sans-serif;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(120% 80% at 50% 8%,#FDF8EE 0%,#F5E9D4 55%,#ECDBBD 100%);color:var(--ink);
    font-family:var(--sans);padding:2rem;-webkit-font-smoothing:antialiased;}
  svg.mark{width:44px;height:44px;stroke:var(--gold);stroke-width:1.3;fill:none;stroke-linecap:round;stroke-linejoin:round;margin-bottom:1.6rem;}
  .code{font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-deep);font-weight:600;}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,6vw,3.4rem);margin:.6rem 0 .5rem;line-height:1.1;}
  p{color:var(--ink-soft);max-width:40ch;margin:0 auto 2rem;}
  a.btn{display:inline-flex;align-items:center;gap:.6em;font-size:.78rem;letter-spacing:.13em;text-transform:uppercase;font-weight:600;
    padding:1.05em 1.9em;border-radius:3px;background:var(--ink);color:var(--paper);text-decoration:none;transition:transform .3s;}
  a.btn:hover{transform:translateY(-2px);}
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="4"/><path d="M12 3v3M4.7 6.7l1.6 1.6M19.3 6.7l-1.6 1.6M2.5 13.5h2M19.5 13.5h2M4 20h16"/></svg>
  <span class="code">Erreur 404</span>
  <h1>Cette page s'est éclipsée</h1>
  <p>La page que vous cherchez n'existe pas ou a été déplacée. Retrouvons le fil de votre bel événement.</p>
  <a class="btn" href="/">Retour à l'accueil</a>
</body>
</html>
